ar: { name: "العربية", t: ["سياسة الخصوصية — Mahjong Atlas", "آخر تحديث: 1 أكتوبر 2026",
 "تنطبق سياسة الخصوصية هذه على لعبة الهاتف المحمول <b>Mahjong Atlas</b> (\"التطبيق\") التي طورتها ونشرتها <b>Studio Ekin</b> (\"نحن\"). باستخدامك للتطبيق فإنك توافق على الممارسات الموضحة في هذه السياسة.",
 "المعلومات التي نجمعها", "لا نجمع أي معلومات شخصية بشكل مباشر ولا نخزنها ولا نشاركها. لا يتطلب التطبيق التسجيل ولا يطلب اسمك أو بريدك الإلكتروني أو أي بيانات شخصية أخرى.",
 "خدمات الطرف الثالث: الإعلانات", "يعرض التطبيق إعلانات تقدمها <b>Google AdMob</b>، وهي خدمة من Google. قد تجمع AdMob بعض البيانات وتستخدمها تلقائيًا، ومنها:",
 ["معرّفات الجهاز (مثل المعرّف الإعلاني)", "عنوان IP والموقع التقريبي", "معلومات الجهاز (الطراز وإصدار نظام التشغيل)", "بيانات التفاعل مع الإعلانات (المشاهدات والنقرات)"],
 "تستخدم Google هذه البيانات لعرض الإعلانات وقياسها. لمزيد من المعلومات: <a href=\"https://policies.google.com/privacy\">سياسة خصوصية Google</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">كيف تستخدم Google البيانات من التطبيقات الشريكة</a>.",
 "في المنطقة الاقتصادية الأوروبية والمملكة المتحدة وسويسرا والمناطق الأخرى التي يفرض فيها القانون ذلك، يطلب التطبيق موافقتك عبر نموذج الموافقة من Google قبل عرض الإعلانات المخصّصة. يمكنك تغيير اختيارك في أي وقت من زر \"الخصوصية\" في قائمة التطبيق.",
 "يمكنك أيضًا إيقاف الإعلانات المخصّصة على جهازك: في Android عبر الإعدادات ← Google ← الإعلانات، وفي iOS عبر الإعدادات ← الخصوصية والأمان ← التتبع.",
 "البيانات المخزنة على جهازك", "يُحفظ تقدمك في اللعبة وإعدادات اللغة والصوت على جهازك فقط. لا تُرسل إلينا أو إلى أي خادم أبدًا، وتُحذف عند إلغاء تثبيت التطبيق.",
 "خصوصية الأطفال", "التطبيق غير موجّه للأطفال دون 13 عامًا ولا نجمع عن علم معلومات شخصية من الأطفال. تُعرض الإعلانات وفق سياسات Google AdMob. إذا كنت تعتقد أن طفلًا قدّم معلومات شخصية عبر التطبيق، فتواصل معنا وسنتخذ الإجراء المناسب.",
 "التغييرات على هذه السياسة", "قد نحدّث سياسة الخصوصية هذه من وقت لآخر. ستُنشر التغييرات في هذه الصفحة مع تاريخ مراجعة جديد.",
 "اتصل بنا", "إذا كانت لديك أسئلة حول سياسة الخصوصية هذه، راسلنا على: <a href=\"mailto:fadiyezz@gmail.com\">fadiyezz@gmail.com</a>"] },
hi: { name: "हिन्दी", t: ["गोपनीयता नीति — Mahjong Atlas", "अंतिम अपडेट: 1 अक्टूबर 2026",
 "यह गोपनीयता नीति <b>Studio Ekin</b> (\"हम\") द्वारा विकसित और प्रकाशित मोबाइल गेम <b>Mahjong Atlas</b> (\"ऐप\") पर लागू होती है। ऐप का उपयोग करके आप इस नीति में बताई गई प्रक्रियाओं से सहमत होते हैं।",
 "हम कौन-सी जानकारी एकत्र करते हैं", "हम सीधे तौर पर कोई भी व्यक्तिगत जानकारी एकत्र, संग्रहीत या साझा नहीं करते। ऐप में पंजीकरण की ज़रूरत नहीं है और यह आपका नाम, ईमेल पता या कोई अन्य व्यक्तिगत विवरण नहीं माँगता।",
 "तृतीय-पक्ष सेवाएँ: विज्ञापन", "ऐप Google की सेवा <b>Google AdMob</b> द्वारा दिए गए विज्ञापन दिखाता है। AdMob अपने आप कुछ डेटा एकत्र और उपयोग कर सकता है, जैसे:",
 ["डिवाइस पहचानकर्ता (जैसे विज्ञापन आईडी)", "IP पता और अनुमानित स्थान", "डिवाइस की जानकारी (मॉडल, ऑपरेटिंग सिस्टम संस्करण)", "विज्ञापन से जुड़ाव का डेटा (देखना, क्लिक)"],
 "Google इस डेटा का उपयोग विज्ञापन दिखाने और मापने के लिए करता है। अधिक जानें: <a href=\"https://policies.google.com/privacy\">Google गोपनीयता नीति</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">Google पार्टनर ऐप्स के डेटा का उपयोग कैसे करता है</a>।",
 "यूरोपीय आर्थिक क्षेत्र, यूनाइटेड किंगडम, स्विट्ज़रलैंड और जहाँ कानून की आवश्यकता हो, वहाँ ऐप व्यक्तिगत विज्ञापन दिखाने से पहले Google के सहमति फ़ॉर्म से आपकी सहमति माँगता है। आप ऐप के मेन्यू में \"गोपनीयता\" बटन से कभी भी अपना विकल्प बदल सकते हैं।",
 "आप अपने डिवाइस पर व्यक्तिगत विज्ञापन बंद भी कर सकते हैं: Android पर सेटिंग्स → Google → विज्ञापन; iOS पर सेटिंग्स → गोपनीयता और सुरक्षा → ट्रैकिंग।",
 "आपके डिवाइस पर सहेजा गया डेटा", "आपकी गेम प्रगति और भाषा व ध्वनि सेटिंग्स केवल आपके डिवाइस पर सहेजी जाती हैं। वे कभी हमें या किसी सर्वर को नहीं भेजी जातीं और ऐप अनइंस्टॉल करने पर हट जाती हैं।",
 "बच्चों की गोपनीयता", "यह ऐप 13 वर्ष से कम उम्र के बच्चों के लिए नहीं है और हम जानबूझकर बच्चों की व्यक्तिगत जानकारी एकत्र नहीं करते। विज्ञापन Google AdMob नीतियों के अनुसार दिखाए जाते हैं। यदि आपको लगता है कि किसी बच्चे ने ऐप के माध्यम से व्यक्तिगत जानकारी दी है, तो हमसे संपर्क करें, हम उचित कदम उठाएँगे।",
 "इस नीति में बदलाव", "हम समय-समय पर इस गोपनीयता नीति को अपडेट कर सकते हैं। बदलाव नई तारीख के साथ इसी पेज पर प्रकाशित किए जाएँगे।",
 "संपर्क करें", "इस गोपनीयता नीति के बारे में किसी भी प्रश्न के लिए हमें लिखें: <a href=\"mailto:fadiyezz@gmail.com\">fadiyezz@gmail.com</a>"] },
zh: { name: "中文", t: ["隐私政策 — Mahjong Atlas", "最后更新：2026年10月1日",
 "本隐私政策适用于由 <b>Studio Ekin</b>（\"我们\"）开发和发布的手机游戏 <b>Mahjong Atlas</b>（\"本应用\"）。使用本应用即表示你同意本政策所述的做法。",
 "我们收集的信息", "我们不会直接收集、存储或分享任何个人信息。本应用无需注册，也不会要求你提供姓名、电子邮箱或其他个人资料。",
 "第三方服务：广告", "本应用展示由 Google 提供的 <b>Google AdMob</b> 广告服务投放的广告。AdMob 可能会自动收集和使用部分数据，包括：",
 ["设备标识符（如广告 ID）", "IP 地址和大致位置", "设备信息（型号、操作系统版本）", "广告互动数据（展示、点击）"],
 "Google 使用这些数据来投放和衡量广告。了解更多：<a href=\"https://policies.google.com/privacy\">Google 隐私权政策</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">Google 如何使用合作伙伴应用中的数据</a>。",
 "在欧洲经济区、英国、瑞士以及法律要求的其他地区，本应用会在展示个性化广告前通过 Google 同意表单征求你的同意。你可以随时通过应用菜单中的\"隐私设置\"按钮更改选择。",
 "你也可以在设备上关闭个性化广告：Android 上前往 设置 → Google → 广告；iOS 上前往 设置 → 隐私与安全性 → 跟踪。",
 "存储在你设备上的数据", "你的游戏进度以及语言和声音设置仅保存在你的设备上，绝不会发送给我们或任何服务器，卸载本应用时即会删除。",
 "儿童隐私", "本应用并非面向 13 岁以下儿童，我们不会故意收集儿童的个人信息。广告按照 Google AdMob 政策投放。如果你认为有儿童通过本应用提供了个人信息，请联系我们，我们将采取适当措施。",
 "政策变更", "我们可能会不时更新本隐私政策。变更将在本页面发布并注明新的修订日期。",
 "联系我们", "如对本隐私政策有任何疑问，请联系：<a href=\"mailto:fadiyezz@gmail.com\">fadiyezz@gmail.com</a>"] },
ja: { name: "日本語", t: ["プライバシーポリシー — Mahjong Atlas", "最終更新日：2026年10月1日",
 "本プライバシーポリシーは、<b>Studio Ekin</b>（以下「当社」）が開発・公開するモバイルゲーム <b>Mahjong Atlas</b>（以下「本アプリ」）に適用されます。本アプリを利用することで、本ポリシーに記載された取り扱いに同意したものとみなされます。",
 "収集する情報", "当社は個人情報を直接収集・保存・共有することはありません。本アプリは登録不要で、お名前やメールアドレスなどの個人情報を求めることはありません。",
 "第三者サービス：広告", "本アプリでは Google が提供する <b>Google AdMob</b> の広告を表示します。AdMob は次のような一部のデータを自動的に収集・利用する場合があります。",
 ["デバイス識別子（広告 ID など）", "IP アドレスとおおよその位置情報", "デバイス情報（機種、OS のバージョン）", "広告への反応データ（表示、クリック）"],
 "Google はこれらのデータを広告の配信と効果測定に使用します。詳しくは <a href=\"https://policies.google.com/privacy\">Google プライバシーポリシー</a> ・ <a href=\"https://policies.google.com/technologies/partner-sites\">Google によるパートナーアプリのデータの使用</a> をご覧ください。",
 "欧州経済領域、英国、スイス、その他法律で求められる地域では、本アプリはパーソナライズ広告を表示する前に Google の同意フォームでお客様の同意を求めます。選択はアプリのメニューにある「プライバシー」ボタンからいつでも変更できます。",
 "パーソナライズ広告は端末の設定でもオフにできます。Android：設定 → Google → 広告、iOS：設定 → プライバシーとセキュリティ → トラッキング。",
 "端末に保存されるデータ", "ゲームの進行状況と言語・サウンド設定は端末内にのみ保存されます。当社やサーバーに送信されることはなく、本アプリをアンインストールすると削除されます。",
 "お子様のプライバシー", "本アプリは 13 歳未満のお子様を対象としておらず、当社がお子様の個人情報を故意に収集することはありません。広告は Google AdMob のポリシーに従って配信されます。お子様が本アプリを通じて個人情報を提供したと思われる場合はご連絡ください。適切に対応いたします。",
 "本ポリシーの変更", "本プライバシーポリシーは随時更新されることがあります。変更内容は新しい改訂日とともに本ページに掲載します。",
 "お問い合わせ", "本プライバシーポリシーに関するご質問は次までお寄せください：<a href=\"mailto:fadiyezz@gmail.com\">fadiyezz@gmail.com</a>"] },
ko: { name: "한국어", t: ["개인정보처리방침 — Mahjong Atlas", "최종 업데이트: 2026년 10월 1일",
 "본 개인정보처리방침은 <b>Studio Ekin</b>(\"당사\")이 개발하고 배포하는 모바일 게임 <b>Mahjong Atlas</b>(\"앱\")에 적용됩니다. 앱을 사용하면 본 방침에 설명된 내용에 동의하는 것으로 간주됩니다.",
 "수집하는 정보", "당사는 개인정보를 직접 수집, 저장 또는 공유하지 않습니다. 앱은 회원가입이 필요 없으며 이름, 이메일 주소 등 개인정보를 요구하지 않습니다.",
 "제3자 서비스: 광고", "앱은 Google이 제공하는 <b>Google AdMob</b>의 광고를 표시합니다. AdMob은 다음과 같은 일부 데이터를 자동으로 수집하고 사용할 수 있습니다.",
 ["기기 식별자(광고 ID 등)", "IP 주소 및 대략적인 위치", "기기 정보(모델, 운영체제 버전)", "광고 상호작용 데이터(조회, 클릭)"],
 "Google은 이 데이터를 광고 게재 및 측정에 사용합니다. 자세히 보기: <a href=\"https://policies.google.com/privacy\">Google 개인정보처리방침</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">Google이 파트너 앱의 데이터를 사용하는 방법</a>.",
 "유럽경제지역, 영국, 스위스 및 법률상 필요한 기타 지역에서는 맞춤 광고를 표시하기 전에 Google 동의 양식을 통해 동의를 요청합니다. 앱 메뉴의 \"개인정보 설정\" 버튼에서 언제든지 선택을 변경할 수 있습니다.",
 "기기에서도 맞춤 광고를 끌 수 있습니다: Android는 설정 → Google → 광고, iOS는 설정 → 개인정보 보호 및 보안 → 추적.",
 "기기에 저장되는 데이터", "게임 진행 상황과 언어 및 사운드 설정은 기기에만 저장됩니다. 당사나 서버로 전송되지 않으며 앱을 삭제하면 함께 삭제됩니다.",
 "아동의 개인정보", "앱은 13세 미만 아동을 대상으로 하지 않으며 당사는 아동의 개인정보를 고의로 수집하지 않습니다. 광고는 Google AdMob 정책에 따라 게재됩니다. 아동이 앱을 통해 개인정보를 제공했다고 생각되면 연락해 주세요. 적절한 조치를 취하겠습니다.",
 "방침의 변경", "본 개인정보처리방침은 수시로 업데이트될 수 있습니다. 변경 사항은 새 개정일과 함께 이 페이지에 게시됩니다.",
 "문의하기", "본 개인정보처리방침에 관한 문의: <a href=\"mailto:fadiyezz@gmail.com\">fadiyezz@gmail.com</a>"] },
id: { name: "Bahasa Indonesia", t: ["Kebijakan Privasi — Mahjong Atlas", "Terakhir diperbarui: 1 Oktober 2026",
 "Kebijakan privasi ini berlaku untuk game seluler <b>Mahjong Atlas</b> (\"Aplikasi\"), yang dikembangkan dan diterbitkan oleh <b>Studio Ekin</b> (\"kami\"). Dengan menggunakan Aplikasi, Anda menyetujui praktik yang dijelaskan dalam kebijakan ini.",
 "Informasi yang Kami Kumpulkan", "Kami tidak mengumpulkan, menyimpan, atau membagikan informasi pribadi apa pun secara langsung. Aplikasi tidak memerlukan pendaftaran dan tidak meminta nama, alamat email, atau data pribadi lainnya.",
 "Layanan Pihak Ketiga: Iklan", "Aplikasi menampilkan iklan dari <b>Google AdMob</b>, layanan milik Google. AdMob dapat mengumpulkan dan menggunakan data tertentu secara otomatis, termasuk:",
 ["Pengenal perangkat (seperti ID Iklan)", "Alamat IP dan perkiraan lokasi", "Informasi perangkat (model, versi sistem operasi)", "Data interaksi iklan (tayangan, klik)"],
 "Google menggunakan data ini untuk menampilkan dan mengukur iklan. Selengkapnya: <a href=\"https://policies.google.com/privacy\">Kebijakan Privasi Google</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">Cara Google menggunakan data dari aplikasi mitra</a>.",
 "Di Wilayah Ekonomi Eropa, Inggris, Swiss, dan wilayah lain yang diwajibkan hukum, Aplikasi meminta persetujuan Anda melalui formulir persetujuan Google sebelum menampilkan iklan yang dipersonalisasi. Anda dapat mengubah pilihan kapan saja melalui tombol \"Privasi\" di menu Aplikasi.",
 "Anda juga dapat menonaktifkan iklan yang dipersonalisasi di perangkat: di Android, Setelan → Google → Iklan; di iOS, Pengaturan → Privasi & Keamanan → Pelacakan.",
 "Data yang Disimpan di Perangkat Anda", "Progres game serta setelan bahasa dan suara hanya disimpan di perangkat Anda. Data ini tidak pernah dikirim kepada kami atau ke server mana pun dan akan terhapus saat Anda meng-uninstal Aplikasi.",
 "Privasi Anak", "Aplikasi tidak ditujukan untuk anak di bawah 13 tahun dan kami tidak dengan sengaja mengumpulkan informasi pribadi anak. Iklan ditayangkan sesuai kebijakan Google AdMob. Jika Anda yakin seorang anak telah memberikan informasi pribadi melalui Aplikasi, hubungi kami dan kami akan mengambil tindakan yang sesuai.",
 "Perubahan Kebijakan Ini", "Kami dapat memperbarui kebijakan privasi ini dari waktu ke waktu. Perubahan akan dipublikasikan di halaman ini dengan tanggal revisi baru.",
 "Hubungi Kami", "Jika ada pertanyaan tentang kebijakan privasi ini, hubungi kami di: <a href=\"mailto:fadiyezz@gmail.com\">fadiyezz@gmail.com</a>"] },
vi: { name: "Tiếng Việt", t: ["Chính sách quyền riêng tư — Mahjong Atlas", "Cập nhật lần cuối: 1 tháng 10 năm 2026",
 "Chính sách quyền riêng tư này áp dụng cho trò chơi di động <b>Mahjong Atlas</b> (\"Ứng dụng\") do <b>Studio Ekin</b> (\"chúng tôi\") phát triển và phát hành. Khi sử dụng Ứng dụng, bạn đồng ý với các nội dung được mô tả trong chính sách này.",
 "Thông tin chúng tôi thu thập", "Chúng tôi không trực tiếp thu thập, lưu trữ hay chia sẻ bất kỳ thông tin cá nhân nào. Ứng dụng không yêu cầu đăng ký và không hỏi tên, địa chỉ email hay thông tin cá nhân khác của bạn.",
 "Dịch vụ bên thứ ba: Quảng cáo", "Ứng dụng hiển thị quảng cáo do <b>Google AdMob</b>, một dịch vụ của Google, cung cấp. AdMob có thể tự động thu thập và sử dụng một số dữ liệu, bao gồm:",
 ["Mã nhận dạng thiết bị (như ID quảng cáo)", "Địa chỉ IP và vị trí gần đúng", "Thông tin thiết bị (kiểu máy, phiên bản hệ điều hành)", "Dữ liệu tương tác với quảng cáo (lượt xem, lượt nhấp)"],
 "Google sử dụng dữ liệu này để hiển thị và đo lường quảng cáo. Tìm hiểu thêm: <a href=\"https://policies.google.com/privacy\">Chính sách quyền riêng tư của Google</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">Cách Google sử dụng dữ liệu từ ứng dụng đối tác</a>.",
 "Tại Khu vực Kinh tế Châu Âu, Vương quốc Anh, Thụy Sĩ và các khu vực khác mà luật pháp yêu cầu, Ứng dụng sẽ xin sự đồng ý của bạn qua biểu mẫu của Google trước khi hiển thị quảng cáo được cá nhân hóa. Bạn có thể thay đổi lựa chọn bất cứ lúc nào bằng nút \"Quyền riêng tư\" trong menu của Ứng dụng.",
 "Bạn cũng có thể tắt quảng cáo được cá nhân hóa trên thiết bị: trên Android, Cài đặt → Google → Quảng cáo; trên iOS, Cài đặt → Quyền riêng tư & Bảo mật → Theo dõi.",
 "Dữ liệu lưu trên thiết bị của bạn", "Tiến trình chơi và cài đặt ngôn ngữ, âm thanh chỉ được lưu trên thiết bị của bạn. Chúng không bao giờ được gửi cho chúng tôi hay bất kỳ máy chủ nào và sẽ bị xóa khi bạn gỡ cài đặt Ứng dụng.",
 "Quyền riêng tư của trẻ em", "Ứng dụng không dành cho trẻ em dưới 13 tuổi và chúng tôi không cố ý thu thập thông tin cá nhân của trẻ em. Quảng cáo được hiển thị theo chính sách của Google AdMob. Nếu bạn cho rằng một trẻ em đã cung cấp thông tin cá nhân qua Ứng dụng, hãy liên hệ với chúng tôi để chúng tôi xử lý phù hợp.",
 "Thay đổi chính sách", "Chúng tôi có thể cập nhật chính sách quyền riêng tư này theo thời gian. Các thay đổi sẽ được đăng trên trang này kèm ngày sửa đổi mới.",
 "Liên hệ", "Nếu có câu hỏi về chính sách quyền riêng tư này, hãy liên hệ: <a href=\"mailto:fadiyezz@gmail.com\">fadiyezz@gmail.com</a>"] },
};

function show(code) {
  const t = (L[code] || L.en).t;
  document.documentElement.lang = code;
  document.documentElement.dir = code === "ar" ? "rtl" : "ltr";
  document.title = t[0];
  document.getElementById("t-title").textContent = t[0];
  document.getElementById("t-date").textContent = t[1];
  const sec = (h, ...ps) => `<h2>${h}</h2>` + ps.map(p => `<p>${p}</p>`).join("");
  document.getElementById("content").innerHTML =
    `<p>${t[2]}</p>` + sec(t[3], t[4]) +
    `<h2>${t[5]}</h2><p>${t[6]}</p><ul>${t[7].map(i => `<li>${i}</li>`).join("")}</ul><p>${t[8]}</p><p>${t[9]}</p><p>${t[10]}</p>` +
    sec(t[11], t[12]) + sec(t[13], t[14]) + sec(t[15], t[16]) + sec(t[17], t[18]);
}

const sel = document.getElementById("lang");
sel.innerHTML = Object.entries(L).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join("");
// ?lang=xx, then the browser language, then English.
const want = new URLSearchParams(location.search).get("lang") || (navigator.language || "en").slice(0, 2).toLowerCase();
const start = L[want] ? want : "en";
sel.value = start;
sel.onchange = () => show(sel.value);
show(start);
</script>
